# Code generation for `alteri_one_core`.
#
# `schemantic` emits the profile schema (ADR-0015) through
# `source_gen:combining_builder`; the header below stamps the generated file
# with the project licence and silences the two style lints that the generator's
# constructor style trips. The file is regenerated by `tools/codegen_check`, so
# the lints cannot be fixed in place.
targets:
  $default:
    builders:
      source_gen:combining_builder:
        dev_options:
          header: |
            // Copyright 2026 The AlteriOne Authors.
            // SPDX-License-Identifier: Apache-2.0
            //
            // GENERATED CODE - DO NOT MODIFY BY HAND
            // ignore_for_file: prefer_const_constructors, unnecessary_type_name_in_constructor