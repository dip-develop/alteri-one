name: dependabot
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  # The product workspace. Inactive until task 0.1 creates the root pubspec.yaml, at which
  # point Dependabot starts opening PRs against it.
  #
  # These are opened as PRs and never merged automatically: pub upgrades interact with the
  # committed pubspec.lock and with freezed 4.x's exact pins, so a bump needs the codegen
  # and analysis gates to run. See ADR-0001.
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, dart]
    commit-message:
      prefix: "chore(deps):"

  # The project website. It is a separate package outside the pub workspace, so it is a
  # separate Dependabot target: the `pub` ecosystem scans a different `directory` from the
  # product's `/`. Without this entry site/pubspec.lock never ages, and a site build breaks
  # on a version bump the product's ecosystem would never surface. The two resolve to
  # incompatible build_runner constraints on purpose — see ADR-0020 — so a single combined
  # target could not represent them anyway.
  - package-ecosystem: pub
    directory: /site
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, site]
    commit-message:
      prefix: "chore(deps):"
