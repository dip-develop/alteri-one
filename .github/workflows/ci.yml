name: ci

# The deterministic gate. One job per operating system, plus the workspace-level
# contract tests.
#
# Phase awareness is explicit. The repository is specification-first: task 0.1 creates the
# Dart workspace and Phase 3 creates the Tier 2 suite. Jobs for phases that have not landed
# are skipped rather than failed, and a `detect` job publishes that state as job outputs,
# because `hashFiles` is not reliably available in a job-level `if`.
#
# One gate here is about naming rather than behaviour. ADR-0016 splits naming at the build
# boundary, and the source tree is deliberately on the `alteri_one_*` side of it, so the
# gate is aimed at the release-facing surfaces only.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DART_VERSION: "3.13.4"

jobs:
  detect:
    name: Detect repository phase
    runs-on: ubuntu-latest
    outputs:
      has_workspace: ${{ steps.detect.outputs.has_workspace }}
      has_tier2: ${{ steps.detect.outputs.has_tier2 }}
      has_app: ${{ steps.detect.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          set -euo pipefail
          [ -f pubspec.yaml ] && w=true || w=false
          if compgen -G "packages/alteri_one_platform/test/tier2/*" > /dev/null; then t=true; else t=false; fi
          [ -d apps/gui ] && a=true || a=false
          {
            echo "has_workspace=$w"
            echo "has_tier2=$t"
            echo "has_app=$a"
          } >> "$GITHUB_OUTPUT"
          echo "workspace=$w tier2=$t app=$a"

  documentation:
    name: Documentation and governance
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The documentation checker is a dependency-free Dart script under tool/, so it needs
      # only the SDK — not `dart pub get`, which is what makes it usable in this job on a
      # repository that has no workspace yet.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Documentation integrity
        # Links, anchors and reachability. Runs on every change, in every phase.
        run: dart tool/docs/check_doc_links.dart --orphans

      - name: Governance documents present
        # Task 0.3 asserts these. Cheap to check early, and it stops them going missing.
        run: |
          set -euo pipefail
          for f in SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md ARCHITECTURE.md \
                   TODO.md .github/CODEOWNERS docs/security/threat-model.md \
                   docs/decisions/README.md .github/workflows/ci.yml \
                   tool/docs/check_doc_links.dart; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          echo "governance documents present"

      - name: Specification is English-only
        # A stray Cyrillic string means content was pasted in without translation, which
        # silently breaks the localisation contract in task 0.11.
        run: |
          set -euo pipefail
          if git grep -nP '[\x{0400}-\x{04FF}]' -- '*.md'; then
            echo "::error::Cyrillic text found. The specification is English-only."
            exit 1
          fi
          echo "no Cyrillic found"

      - name: The installed product carries no alteri_one
        # ADR-0016: `alteri_one_*` is the Dart convention for source packages, `alterione`
        # is everything the user receives. The source tree keeps its spelling on purpose, so
        # this gate is aimed at the release-facing surfaces and nowhere else. A stray
        # `alteri_one/` under the install root is a support defect waiting to happen: the
        # user types one word and a bug report names a different directory.
        if: needs.detect.outputs.has_workspace == 'true'
        run: |
          set -euo pipefail

          # Scope A: the installer templates, which are copied verbatim into the install
          # root. Zero tolerance, no prose to read.
          if git grep -n 'alteri_one' -- 'tool/install/**'; then
            echo "::error::alteri_one found in an installer template."
            echo "The installed product is alterione. See docs/decisions/0016-product-naming.md."
            exit 1
          fi

          # _artifacts.yml builds the release; it is not shipped. It may name the source
          # package whose closure it gates — that is the Dart-convention side of the
          # boundary — and nothing else in it may carry the old spelling into an asset
          # name, an installed path or a manifest payload.
          if git grep -n 'alteri_one' -- .github/workflows/_artifacts.yml \
            | grep -vE 'alteri_one_cli([^A-Za-z0-9_]|$)'; then
            echo "::error::alteri_one found in the release assembly outside a source package name."
            echo "Assets are named alterione-<target>. See docs/decisions/0016-product-naming.md."
            exit 1
          fi

          # Scope B: the documented install root, in install-and-update.md and
          # workspace-layout.md. These two documents deliberately describe *both* sides of
          # the build boundary, so their prose has to be able to name the Dart-convention
          # package names, and has to be able to state this prohibition itself. A blanket
          # ban on the file would forbid the documents that define the ban. What must never
          # appear is an installed path, so the check is scoped to the fenced blocks that
          # draw the install root and looks for an alteri_one segment inside them.
          if ! awk '
            FNR == 1 { inblock = 0 }
            /^```/ {
              if (inblock) {
                if ((index(block, "~/.alterione") || index(block, "ALTERIONE_HOME")) \
                    && index(block, "alteri_one")) {
                  printf "  %s:%d: the documented install root contains alteri_one\n",
                         FILENAME, start
                  bad = 1
                }
                inblock = 0
              } else {
                inblock = 1; start = FNR; block = ""
              }
              next
            }
            inblock { block = block $0 "\n" }
            END { exit bad ? 1 : 0 }
          ' docs/architecture/install-and-update.md docs/architecture/workspace-layout.md; then
            echo "::error::the documented install root names alteri_one."
            echo "The install root is ~/.alterione. See docs/decisions/0016-product-naming.md."
            exit 1
          fi

          echo "installed product is free of alteri_one"

  workspace-contracts:
    name: Workspace and CI contract tests
    needs: detect
    if: needs.detect.outputs.has_workspace == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Resolve
        run: dart pub get

      # Each contract test belongs to a task, so the set grows one file at a time. A test
      # that has landed always runs; one whose task has not landed yet is reported and
      # skipped, which is the same policy the jobs above follow for a phase. The loop fails
      # if none of them exists, so this step cannot go green by finding nothing.
      - name: Contract tests
        run: |
          set -euo pipefail
          ran=0
          for f in test/workspace/workspace_contract_test.dart \
                   test/ci/quality_gates_contract_test.dart \
                   test/ci/telemetry_allowlist_test.dart \
                   test/governance/documentation_contract_test.dart; do
            if [ ! -f "$f" ]; then
              echo "::notice::$f has not landed yet; its task has not run."
              continue
            fi
            dart test "$f"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::no contract test found; the workspace job is not gating anything."
            exit 1
          fi
          echo "$ran contract test file(s) passed"

  matrix:
    name: ${{ matrix.os }} · codegen, analyse, format, test
    needs: [detect, documentation]
    if: needs.detect.outputs.has_workspace == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Install Melos
        run: dart pub global activate melos

      - name: Resolve
        run: dart pub get

      # Order matters. Codegen first because analysis of generated code is part of the
      # gate; format last so it checks the post-codegen tree.
      - name: Codegen
        run: melos run generate

      - name: Analyse
        run: melos run analyze

      - name: Format
        # Two commands, one gate. `format` walks each package; `format:root` covers the
        # root package's own `test/` and `tool/` by path, because `dart format` has no
        # exclude flag and would otherwise walk into the website — a different toolchain
        # with its own build gate (ADR-0020).
        run: |
          melos run format
          melos run format:root

      - name: Test
        run: melos run test

      - name: Offline end-to-end
        run: melos exec -c 1 --scope="alteri_one_cli" -- dart test --tags offline-e2e

      - name: Tier 2 sandbox suite
        # Linux only. macOS and Windows have a separate job below that asserts refusal.
        if: needs.detect.outputs.has_tier2 == 'true' && matrix.os == 'ubuntu-latest'
        run: melos exec -c 1 --scope="alteri_one_platform" -- dart test test/tier2/

  tier2-refusal:
    name: ${{ matrix.os }} · Tier 2 refuses
    needs: [detect, documentation]
    # Off Linux this suite asserts an explicit refusal before any process is created. The
    # refusal is a pass; a skip would hide a regression to "degrade instead of refuse".
    if: needs.detect.outputs.has_tier2 == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - run: dart pub global activate melos
      - run: dart pub get
      - run: melos exec -c 1 --scope="alteri_one_platform" -- dart test test/tier2/platform_policy_contract_test.dart
