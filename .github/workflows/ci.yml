name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Provides both Flutter and the pinned Dart SDK for the workspace.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Docs check
        run: dart run tools/docs_check/bin/docs_check.dart

      - name: Generated code check
        run: dart run tools/codegen_check/bin/codegen_check.dart

      # Melos is resolved from the workspace lock, not installed globally.
      - name: CI
        run: dart run melos run ci --no-select
