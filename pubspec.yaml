name: alteri_one_workspace
publish_to: none

description: >-
  Workspace root of AlteriOne: a personal universal assistant with chat, task,
  and resident modes in one runtime. Configuration and scripts only; no code.

environment:
  sdk: ^3.13.0

# Dart pub workspace: one lock file, one shared resolution for all members.
# Globs are supported since Dart 3.11 (docs/spec/architecture.md, section 5.1).
workspace:
  - packages/*
  - providers/*
  - extensions/*
  - runtime/*
  - clients/*
  - e2e
  - tools/*

dev_dependencies:
  melos: ^8.0.0

melos:
  scripts:
    format: dart format --set-exit-if-changed .
    analyze:
      exec:
        command: dart analyze --fatal-infos
        concurrency: 1
    gen:
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
    arch: dart run tools/arch_check/bin/arch_check.dart
    test:
      exec:
        command: dart test
        concurrency: 4
      packageFilters:
        dirExists: test
    ci:
      steps:
        - format
        - analyze
        - arch
        - test
