# The official build: the set shipped with the repository.
# Schema: docs/spec/extensions.md, section 11.7. Built by `alterione build`.
# TODO(m5): version ranges below are updated when the first real release is cut.
name: official
version: 0.0.1
mode: local

providers:
  - package: alteri_one_provider_llama_cpp
    version: ^0.0.1

extensions:
  # workspace is dropped from the official build for now (M5 Step 14): it is
  # still a scaffold with no entry class, so naming it breaks the official
  # build. Re-enable by uncommenting once the workspace extension lands (M6).
  # - package: alteri_one_ext_workspace
  #   version: ^0.0.1
  #   load: built_in
  # lsp and mcp are dropped from the official build (owner decision, M5 Step 13):
  # both are scaffolds and the official binary ships without them. Re-enable by
  # uncommenting once they are implemented (docs/spec/integrations-lsp-mcp.md).
  # - package: alteri_one_ext_lsp
  #   version: ^0.0.1
  #   load: built_in
  # - package: alteri_one_ext_mcp
  #   version: ^0.0.1
  #   load: built_in
  - package: alteri_one_ext_memory_hive
    version: ^0.0.1
    load: built_in
  - package: alteri_one_ext_weather
    version: ^0.0.1
    load: built_in

defaults:
  profile: assistant
