name: alteri_one_metrics
description: >-
  Section 2.8 metrics harness for the AlteriOne daemon: cold start, idle
  memory, event delivery latency, and tool-call overhead, compared to the
  documented targets. Exits non-zero when a target is missed or a metric
  cannot be measured.
version: 0.0.1
publish_to: none
repository: https://github.com/dip-develop/alteri-one
issue_tracker: https://github.com/dip-develop/alteri-one/issues
environment:
  sdk: ^3.14.0
resolution: workspace
dependencies:
  alteri_one_core:
    path: ../../runtime/core
  alteri_one_contracts:
    path: ../../packages/contracts
dev_dependencies:
  test: ^1.25.0
