name: alterione_site
description: >-
  The AlteriOne project website. A static site built with Jaspr and published to
  GitHub Pages at https://alteri.one.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.13.0 <4.0.0'

# This package is deliberately NOT a member of the AlteriOne pub workspace. It has its own
# toolchain, its own dependency graph and its own build, and it is not part of the product.
# See docs/decisions/0020-project-website.md and docs/website.md.
dependencies:
  jaspr: ^0.23.5
  jaspr_router: ^0.9.0

dev_dependencies:
  # jaspr_builder runs the pre-render, and build_runner provides the build daemon the
  # builder connects to. Both are required: without build_runner the daemon cannot start
  # and `jaspr build` fails before it renders anything.
  #
  # The constraint is deliberately WIDER at the bottom and NARROWER at the top than the
  # product workspace's `build_runner: ^2.16.1`. jaspr_builder 0.23.5 requires
  # `analyzer ^12.1.0`, and build_runner >=2.15.2 requires `analyzer >=13.3.0 <15.0.0`, so
  # the two cannot be resolved together above 2.15.1. This is the concrete reason the site
  # is not a member of the AlteriOne pub workspace: it is a different closure with a
  # different, incompatible constraint, and merging them would make one of the two builds
  # impossible rather than merely duplicated.
  build_runner: '>=2.15.1 <2.15.2'
  jaspr_builder: 0.23.5
  lints: ^6.0.0

jaspr:
  # Static: every route is pre-rendered to HTML at build time. No server, no Node, no
  # runtime, and the output is a folder of files that GitHub Pages can serve.
  mode: static
  styles: standalone
  # No Flutter embedding and no Flutter plugins, deliberately. This is a public landing
  # page about the project; it is not an interface to a running agent. The web target
  # that *is* — apps/web, a local server hosting a Flutter GUI for working with an agent
  # — is a different program in a different directory, built by Flutter, served by
  # AlteriOne, and never by this site. Enabling `flutter:` here would pull the Flutter SDK
  # into a documentation build for no benefit, and would suggest a capability this site
  # must not have.

