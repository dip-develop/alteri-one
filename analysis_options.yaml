# Shared analyzer configuration for every workspace member.
# Each member includes this file with a relative path, for example:
#   include: ../../analysis_options.yaml
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Section 7.12 of docs/spec/dart-language.md.
    - no_dynamic_casts
    - no_raw_types
    - use_declaring_parameters
    - unnecessary_primary_constructor_body
    - unnecessary_type_name_in_constructor
    - prefer_initializing_formals
    - switch_on_type
    - discarded_futures
    - unawaited_futures
    - unnecessary_unawaited
    - async_return_with_no_await
    - initialize_in_field_declaration
    # Project additions.
    - always_declare_return_types
    - avoid_print
    - avoid_redundant_argument_values
    - cancel_subscriptions
    - directives_ordering
    - library_annotations
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_lambdas
    - unnecessary_parenthesis
    # public_member_api_docs is omitted: the 3.13.5 analyzer does not attach
    # /// comments to primary-constructor parameters, which the spec mandates
    # (dart-language.md 7.2, domain.md 8.x). Parameter docs stay mandatory by
    # convention; see docs/spec/open-questions.md.
